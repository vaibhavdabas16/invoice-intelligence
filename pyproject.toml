[project]
name = "invoice-intelligence"
version = "1.0.0"
description = "LLM-based invoice extraction pipeline with validation, evaluation harness and cost tracking"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data", "outputs", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # currency symbols (rupee, pound, euro) in strings are intentional
    "UP042",                       # keep (str, Enum): StrEnum changes str() output
    "SIM105",                      # explicit try/except/pass reads fine here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "RUF059"]
"tests/test_ui.py" = ["E501"]  # embedded JavaScript harness
"scripts/*" = ["E501"]  # long Markdown table rows in generated reports
"src/api/app.py" = ["B008"]  # File(...) defaults are the FastAPI idiom

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
